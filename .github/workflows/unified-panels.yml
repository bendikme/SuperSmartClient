name: Unified panels

on:
  push:
    branches: [unified-panels]
    tags: ['ssc-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libfltk1.3-dev libgnutls28-dev libjpeg-turbo8-dev libpixman-1-dev \
            zlib1g-dev libgtest-dev libpam0g-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libxtst-dev libxi-dev libxinerama-dev libxcursor-dev \
            libxft-dev libpng-dev xvfb xauth xdotool openssl libsqlite3-dev \
            libsecret-1-dev libsecret-tools gnome-keyring dbus-x11
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VIEWER=ON -DENABLE_GNUTLS=ON -DENABLE_NETTLE=OFF \
            -DENABLE_H264=OFF -DENABLE_WAYLAND=OFF -DENABLE_NLS=OFF
          cmake --build build --target vncviewer unifiedpanel dashboardmodel --parallel 4
      - name: Test profile and TLS connections
        run: |
          ctest --test-dir build/tests/unit -R UnifiedPanel --output-on-failure
          xvfb-run -a python3 tests/integration/unified_panel.py \
            --viewer build/vncviewer/vncviewer --input-tests
          bash tests/integration/isolated-keyring.sh ctest --test-dir build/tests/unit \
            -R DashboardModel --output-on-failure
          mkdir -p build/preview
          bash tests/integration/isolated-keyring.sh xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 tests/integration/dashboard.py --viewer build/vncviewer/vncviewer --input-tests \
            --screenshot build/preview/dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-preview
          path: build/preview/*.png

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-fltk1.3
            mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-pixman mingw-w64-x86_64-gtest mingw-w64-x86_64-sqlite3
      - name: Build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VIEWER=ON -DENABLE_GNUTLS=ON -DENABLE_NETTLE=OFF \
            -DENABLE_H264=OFF -DENABLE_NLS=OFF
          cmake --build build --target vncviewer unifiedpanel dashboardmodel --parallel 4
          ctest --test-dir build/tests/unit -R 'UnifiedPanel|DashboardModel' --output-on-failure
      - name: Test TLS connections
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$(Join-Path $env:MSYS2_LOCATION 'mingw64/bin');$env:PATH"
          python tests/integration/unified_panel.py --viewer build/vncviewer/vncviewer.exe
          python tests/integration/dashboard.py --viewer build/vncviewer/vncviewer.exe
      - name: Package portable viewer
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./tests/integration/updater.ps1
          ./contrib/unified/package-windows.ps1 -BuildDir build `
            -RuntimeBin (Join-Path $env:MSYS2_LOCATION 'mingw64/bin')
      - uses: actions/upload-artifact@v4
        with:
          name: SuperSmartClient-windows-x64
          path: |
            dist/workspaces/*.zip
            dist/workspaces/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/ssc-v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: supersmart-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SuperSmartClient-windows-x64
          path: build/release
      - name: Verify version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          version = Path('VERSION.txt').read_text().strip()
          if os.environ['RELEASE_TAG'] != 'ssc-v' + version:
              raise SystemExit('The release tag must match VERSION.txt')
          archive = Path('build/release/SuperSmartClient-windows-x64.zip')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest != Path(str(archive)+'.sha256').read_text().split()[0]:
              raise SystemExit('Package checksum mismatch')
          with zipfile.ZipFile(archive) as z:
              manifest = json.loads(z.read('SuperSmartClient-windows-x64/manifest.json'))
              if manifest['version'] != version:
                  raise SystemExit('Packaged version does not match the release tag')
              for entry in manifest['files']:
                  data = z.read('SuperSmartClient-windows-x64/' + entry['path'])
                  if len(data) != entry['size'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                      raise SystemExit('Packaged file failed verification: ' + entry['path'])
          PY
          version=$(cat VERSION.txt)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "SuperSmartClient $version" \
            --notes-file contrib/unified/RELEASE_NOTES.md \
            build/release/SuperSmartClient-windows-x64.zip \
            build/release/SuperSmartClient-windows-x64.zip.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
